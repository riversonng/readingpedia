<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story de Leituras - Editorial</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ================= RESET & DESIGN SYSTEM ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* 🎨 PALETAS RE-MAPEADAS COM CORES SÓLIDAS */
.theme-coffee { 
    --bg-dark: #120c08; 
    --bg-card: #231610; 
    --text-light: #f5e6d3; 
    --accent: #c69c6d; 
    --accent-muted: #4e3629; 
}

/* Tema Velvet (Velvet Merlot / Biblioteca & Vinho) */
.theme-velvet {
    --bg-dark: #160a0c;
    --bg-card: #2e0c12;
    --text-light: #fbeff0;
    --accent: #e5989b;
    --accent-muted: #31161a;
}

/* Tema Antique (Antique Parchment / Papel Envelhecido & Nanquim) */
.theme-antique {
    --bg-dark: #ded7c3;
    --bg-card: #f4efe2;
    --text-light: #2c251e;
    --accent: #6b5b47;
    --accent-muted: #c4ba9f;
}

/* 🌸 Tema Claro 1: Lavanda Pastel */
.theme-lavender {
    --bg-dark: #e0dcf8;       
    --bg-card: #ffffff;       
    --text-light: #3b2a57;     
    --accent: #ff7597;         
    --accent-muted: #23c1c7;   
}

/* 🌈 Tema Pastel Colorido (Cyberpunk/Neon) */
.theme-pastel-rainbow {
    --bg-dark: #0b0f19;       
    --bg-card: #161c2e;       
    --text-light: #00ffcc;     
    --accent: #ff007f;         
    --accent-muted: #6f80a5;   
}

body {
    font-family: serif;
    background: var(--bg-dark);
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    transition: all 0.3s ease;
}

/* ================= CONTROLES MODERNOS ================= */
.controls {
    background: rgba(0, 0, 0, 0.4);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 25px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    border: none;
}

select, button {
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    background: var(--bg-card);
    color: var(--text-light);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
}

select:focus, button:hover {
    background: var(--accent);
    color: var(--bg-dark);
}

/* ================= STORY CANVAS (EDITORIAL) ================= */
#story-canvas {
    width: 360px;
    height: 640px;
    background: var(--bg-card);
    color: var(--text-light);
    padding: 55px 30px 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    transition: all 0.3s ease;
    border: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* ================= NOVO CABEÇALHO EDITORIAL MINIMALISTA ================= */
.header {
    text-align: center;
    margin-bottom: 20px;
    padding: 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.header .sub {
    font-family: 'Cinzel', serif;
    font-size: 13px; /* Pequeno e elegante */
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 5px; /* Alto espaçamento para dar o ar de revista */
    color: var(--accent);
    display: inline-block;
    position: relative;
    padding: 8px 0;
}

/* Linhas finas decorativas (acima e abaixo) que dão o destaque sutil */
.header .sub::before,
.header .sub::after {
    content: '';
    position: absolute;
    left: 15%;
    right: 15%;
    height: 1px;
    background-color: var(--accent);
    opacity: 0.4;
}

.header .sub::before {
    top: 0;
}

.header .sub::after {
    bottom: 0;
}

/* GRID DE 4 COLUNAS MANTIDO */
.books-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 8px;
    margin-top: 15px;
    margin-bottom: auto;
    padding: 10px 0;
}

.book {
    position: relative;
}

.book img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: 2px;
}

/* BADGES MINIMALISTAS */
.badge {
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--bg-dark);
    color: var(--accent);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    border: none;
    white-space: nowrap;
}

.badge .fav {
    color: #e94343;
    font-size: 9px;
}

/* PAINEL DE ESTATÍSTICAS */
.stats-panel {
    border-top: 1px dashed var(--accent);
    padding-top: 15px;
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat-box {
    text-align: center;
}

.stat-val {
    font-family: serif;
    font-size: 18px;
    color: var(--text-light);
    font-weight: bold;
}

.stat-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-top: 2px;
}
</style>
</head>

<body class="theme-coffee">

<div class="controls">
    <select id="selectYear" onchange="updateStory()"></select>
    <select id="selectMonth" onchange="updateStory()"></select>
    
    <select id="selectTheme" onchange="changeTheme()">
        <option value="theme-coffee">Coffee</option>
        <option value="theme-antique">Antique</option>
        <option value="theme-velvet">Velvet</option>
        <option value="theme-lavender">Lavender</option>
        <option value="theme-pastel-rainbow">Pastel Rainbow</option>
    </select>

    <button onclick="updateStory()">Atualizar</button>
    <button onclick="downloadImage()">Salvar Capa</button>
    <button onclick="downloadYear()">Exportar Ano</button>
</div>

<div id="story-canvas">
    <div class="header">
        <!-- Elemento unificado que conterá apenas: Leituras de [Mês] -->
        <span class="sub" id="displayHeaderTitle"></span>
    </div>

    <div id="booksGrid" class="books-grid"></div>


</div>

<script>
let allBooks = [];
let currentFiltered = [];
const monthsNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

async function init() {
    try {
        const res = await fetch('books.json');
        allBooks = await res.json();
    } catch (e) {
        console.warn("Aviso: books.json não pôde ser carregado. Usando dados fictícios para teste.");
        allBooks = [
            { "YEAR": 2026, "MONTH": "Janeiro", "CAPA": "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=200", "PAGES": 320, "RATING": 4.5, "FAV": "YES" },
            { "YEAR": 2026, "MONTH": "Janeiro", "CAPA": "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=200", "PAGES": 280, "RATING": 4, "FAV": "NO" }
        ];
    }

    const years = [...new Set(allBooks.map(b => b.YEAR))].sort((a, b) => b - a);
    
    selectYear.innerHTML = '';
    selectMonth.innerHTML = '';
    years.forEach(y => selectYear.innerHTML += `<option value="${y}">${y}</option>`);
    monthsNames.forEach(m => selectMonth.innerHTML += `<option value="${m}">${m}</option>`);

    if (allBooks.length > 0) {
        const lastEntry = allBooks[allBooks.length - 1];
        selectYear.value = lastEntry.YEAR;
        selectMonth.value = lastEntry.MONTH;
    }

    updateStory();
}

function changeTheme() {
    document.body.className = document.getElementById('selectTheme').value;
}

function getStars(rating) {
    const full = Math.floor(rating);
    const half = rating % 1 !== 0;
    let stars = '★'.repeat(full);
    if (half) stars += '½';
    return stars;
}

function updateStory() {
    const year = parseInt(selectYear.value);
    const month = selectMonth.value;

    // Cabeçalho modificado para remover o ano por completo
    displayHeaderTitle.innerText = `Leituras de ${month}`;

    currentFiltered = allBooks.filter(b => b.YEAR === year && b.MONTH === month);

    renderBooks(currentFiltered.slice(0, 12));
}

function renderBooks(list) {
    booksGrid.innerHTML = '';
    let totalPages = 0;

    list.forEach(book => {
        totalPages += book.PAGES;

        booksGrid.innerHTML += `
        <div class="book">
            <img src="${book.CAPA}" crossorigin="anonymous">
            <div class="badge">
                <span>${getStars(book.RATING)}</span>
                ${book.FAV === 'YES' ? '<span class="fav">❤</span>' : ''}
            </div>
        </div>`;
    });

    document.getElementById('statBooks').innerText = currentFiltered.length;
    document.getElementById('statPages').innerText = totalPages.toLocaleString('pt-BR');
}

async function downloadImage() {
    const chunkSize = 12;
    for (let i = 0; i < currentFiltered.length; i += chunkSize) {
        renderBooks(currentFiltered.slice(i, i + chunkSize));
        await new Promise(r => setTimeout(r, 250));

        const element = document.getElementById("story-canvas");

        // Configuração estrita de dimensões internas + scale:3 garante saída limpa de 1080x1920
        const canvas = await html2canvas(element,{
            scale: 3,
            useCORS: true,
            allowTaint: false,
            backgroundColor: null,
            width: 360,
            height: 640,
            x: 0,
            y: 0,
            scrollX: 0,
            scrollY: 0,
            imageTimeout: 0,
            logging: false
        });

        const link = document.createElement('a');
        link.download = `story_${selectMonth.value}_p${i/chunkSize + 1}.png`;
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();
    }
    updateStory();
}

async function downloadYear() {
    const year = parseInt(selectYear.value);
    for (let m of monthsNames) {
        const hasBooks = allBooks.some(b => b.YEAR === year && b.MONTH === m);
        if(!hasBooks) continue;

        selectMonth.value = m;
        updateStory();
        await Promise.all(
            [...document.querySelectorAll("#booksGrid img")].map(img=>{
                if(img.complete) return Promise.resolve();
                return new Promise(resolve=>{
                    img.onload = resolve;
                    img.onerror = resolve;
                });
            })
        );

        const canvas = await html2canvas(document.getElementById('story-canvas'), {
            useCORS: true,
            scale: 3,
            width: 360,
            height: 640
        });

        const link = document.createElement('a');
        link.download = `story_${year}_${m}.png`;
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();
    }
    updateStory();
}

init();
</script>

</body>
</html>
