<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story de Leituras - Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Orbitron:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ================= RESET & DESIGN SYSTEM ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

}
body,
select,
button,
.header h1,
.stat-val {
    font-family: var(--font-main) !important;
    
}
/* Dark Academia */
.theme-coffee {
    --bg-dark: #080503;
    --bg-card: #1d140f;
    --text-light: #f5e6d2;
    --accent: #d1782e;
    --accent-muted: #3d1f11;
    --font-main: 'Libre Baskerville', serif;
}

/* Velvet (Roxo + Vinho) */
.theme-velvet {
    --bg-dark: #190b24;
    --bg-card: #2d123e;
    --text-light: #f8f3fb;
    --accent: #d94f70;
    --accent-muted: #6d3bb3;
    --font-main: 'Playfair Display', serif;
}

/* Editorial Azul Escuro */
.theme-Ocean {
    --bg-dark: #010a27;
    --bg-card: #06143d;
    --text-light: #f4f7fb;
    --accent: #28a8a6;
    --accent-muted: #3a506b;
    --font-main: 'Libre Baskerville', serif;
}

/* Coral Moderno */
.theme-lavender {
    --bg-dark: #fff2ed;
    --bg-card: #ffffff;
    --text-light: #47342d;
    --accent: #ff6b6b;
    --accent-muted: #fffac9;
    --font-main: 'Calibri', sans-serif;
}

/* Cyber Blue */
.theme-pastel-rainbow {
    --bg-dark: #070b18;
    --bg-card: #111827;
    --text-light: #f8fafc;
    --accent: #7c3aed;
    --accent-muted: #38bdf8;
    --font-main: 'Orbitron', sans-serif;
}

body {
    font-family: var(--font-main);
    background-color: var(--bg-dark);
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
}

/* ================= CONTROLES MODERNOS ================= */
.controls {
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 25px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

select, button {
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--accent-muted);
    background: var(--bg-dark);
    color: var(--text-light);
    font-size: 13px;
    cursor: pointer;
}

select:focus, button:hover {
    background: var(--accent);
    color: var(--bg-dark);
}

/* ================= STORY CANVAS (EDITORIAL) ================= */
#story-canvas {
    width: 360px;
    height: 640px;
    background:
        radial-gradient(
            circle at top right,
            color-mix(in srgb, var(--accent) 30%, transparent),
            transparent 65%
        ),
        linear-gradient(
            180deg,
            var(--bg-card),
            var(--bg-dark)
        );
    color: var(--text-light);
    padding: 35px 25px 25px 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

/* CABEÇALHO ESTILO REVISTA */
.header {
    text-align: center;
    margin-bottom: 20px;
}

.header .sub {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--accent);
    display: block;
    margin-bottom: 4px;
}

.header h1 {
    font-family: var(--font-main);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 1px;
    line-height: 1.1;
}

.header .year-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 300;
    border-top: 1px solid var(--accent-muted);
    border-bottom: 1px solid var(--accent-muted);
    padding: 2px 15px;
    margin-top: 8px;
    
    letter-spacing: 2px;
}

/* GRID DE 4 COLUNAS MANTIDO */
.books-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px 8px;
    
    margin-bottom: auto;
    padding: 10px 0;
}

.book {
    position: relative;
    
}

.book img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: 2px;
    
}

/* BADGES MINIMALISTAS */
.badge {
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--bg-card);
    color: #ffc506; /* dourado */
    font-size: 12px;
    font-weight: 500;
    padding: 2px 5px;
    border-radius: 4px;
    white-space: nowrap;
}

.badge .fav {
    color: #ff2323;
    font-size: 9px;
}

/* PAINEL DE ESTATÍSTICAS (SUTIL E CONCISO) */
.stats-panel {
    
    padding-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat-box {
    text-align: center;
}

.stat-val {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--text-light);
    font-weight: bold;
}

.stat-lbl {
    font-size: 9px;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 2px;
}
</style>
</head>

<body class="theme-coffee">

<div class="controls">
    <select id="selectYear" onchange="updateStory()"></select>
    <select id="selectMonth" onchange="updateStory()"></select>
    
    <!-- Seletor atualizado apenas com os temas requisitados -->
    <select id="selectTheme" onchange="changeTheme()">
        <option value="theme-coffee">Coffee</option>
        <option value="theme-Ocean">Ocean</option>
        <option value="theme-velvet">Velvet</option>
        <option value="theme-lavender">Lavender</option>
        <option value="theme-pastel-rainbow">Pastel Rainbow</option>
    </select>

    <button onclick="updateStory()">Atualizar</button>
    <button onclick="downloadImage()">Salvar Capa</button>
    <button onclick="downloadYear()">Exportar Ano</button>
</div>

<div id="story-canvas">
    <div class="header">
        <span class="sub">Leituras do mês</span>
        <h1 id="displayMonth"></h1>
    </div>

    <div id="booksGrid" class="books-grid"></div>

    <div id="statsPanel" class="stats-panel">
        <div class="stat-box">
            <div class="stat-val" id="statBooks">0</div>
            <div class="stat-lbl">Livros</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="statPages">0</div>
            <div class="stat-lbl">Páginas</div>
        </div>
    </div>
</div>

<script>
let allBooks = [];
let currentFiltered = [];
const monthsNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

async function init() {
    const res = await fetch('books.json');
    allBooks = await res.json();

    const years = [...new Set(allBooks.map(b => b.YEAR))].sort((a, b) => b - a);
    
    years.forEach(y => selectYear.innerHTML += `<option value="${y}">${y}</option>`);
    monthsNames.forEach(m => selectMonth.innerHTML += `<option value="${m}">${m}</option>`);

    if (allBooks.length > 0) {
        const lastEntry = allBooks[allBooks.length - 1];
        selectYear.value = lastEntry.YEAR;
        selectMonth.value = lastEntry.MONTH;
    }

    updateStory();
}

function changeTheme() {
    document.body.className = document.getElementById('selectTheme').value;
}

function getStars(rating) {
    const full = Math.floor(rating);
    const half = rating % 1 !== 0;
    let stars = '★'.repeat(full);
    if (half) stars += '½';
    return stars;
}

function updateStory() {
    const year = parseInt(selectYear.value);
    const month = selectMonth.value;

    displayMonth.innerText = month;

    currentFiltered = allBooks.filter(b => b.YEAR === year && b.MONTH === month);

    renderBooks(currentFiltered.slice(0, 12));
}

function renderBooks(list) {
    booksGrid.innerHTML = '';
    let totalPages = 0;

    list.forEach(book => {
        totalPages += book.PAGES;

        booksGrid.innerHTML += `
        <div class="book">
            <img src="${book.CAPA}" crossorigin="anonymous">
            <div class="badge">
                <span>${getStars(book.RATING)}</span>
                ${book.FAV === 'YES' ? '<span class="fav">❤</span>' : ''}
            </div>
        </div>`;
    });

    document.getElementById('statBooks').innerText = currentFiltered.length;
    document.getElementById('statPages').innerText = totalPages.toLocaleString('pt-BR');
}

async function downloadImage() {
    const chunkSize = 12;
    for (let i = 0; i < currentFiltered.length; i += chunkSize) {
        renderBooks(currentFiltered.slice(i, i + chunkSize));
        await new Promise(r => setTimeout(r, 250));

        const canvas = await html2canvas(document.getElementById('story-canvas'), {
            useCORS: true,
            scale: 3
        });

        const link = document.createElement('a');
        link.download = `story_${selectMonth.value}_p${i/chunkSize + 1}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
    updateStory();
}

async function downloadYear() {
    const year = parseInt(selectYear.value);
    for (let m of monthsNames) {
        const hasBooks = allBooks.some(b => b.YEAR === year && b.MONTH === m);
        if(!hasBooks) continue;

        selectMonth.value = m;
        updateStory();
        await new Promise(r => setTimeout(r, 300));

        const canvas = await html2canvas(document.getElementById('story-canvas'), {
            useCORS: true,
            scale: 3
        });

        const link = document.createElement('a');
        link.download = `story_${year}_${m}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
    updateStory();
}

init();
</script>

</body>
</html>
